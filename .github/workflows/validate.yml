name: Validate Lua Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Basic syntax check
        run: |
          find src -name '*.lua' -print0 | xargs -0 -n1 lua -e 'assert(loadfile(arg[1]))' _
